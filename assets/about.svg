<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="About Vi: Full-Stack Developer and Project Manager building enterprise and government web apps">
  <defs>
    <clipPath id="card"><rect width="1200" height="470" rx="24"/></clipPath>
    <radialGradient id="glow" cx="1" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4f9a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .kw { fill: #ff7eb6; } .id { fill: #f6eee3; } .pr { fill: #b9d98f; }
    .st { fill: #ffd1a1; } .pu { fill: #8a7590; } .cm { fill: #7d6a83; font-style: italic; }
    .ln { opacity: 0; animation: type .5s ease-out forwards; }
    @keyframes type { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    .cursor { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .3; transform: scale(2); } }
    .knob { animation: knob 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes knob { 0%,42% { transform: translateX(0); } 50%,92% { transform: translateX(104px); } 100% { transform: translateX(0); } }
    .lblDev { animation: dev 6s steps(1) infinite; } .lblPm { animation: pm 6s steps(1) infinite; }
    @keyframes dev { 0% { fill: #150c19; } 46% { fill: #c9b6c4; } 96% { fill: #150c19; } }
    @keyframes pm  { 0% { fill: #c9b6c4; } 46% { fill: #150c19; } 96% { fill: #c9b6c4; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="470" fill="#150c19"/>
    <rect width="1200" height="470" fill="url(#glow)"/>

    <!-- title bar -->
    <rect width="1200" height="50" fill="#1d1222"/>
    <circle cx="30" cy="25" r="6.5" fill="#ff5f57"/>
    <circle cx="52" cy="25" r="6.5" fill="#febc2e"/>
    <circle cx="74" cy="25" r="6.5" fill="#28c840"/>
    <rect x="104" y="10" width="150" height="40" rx="8" fill="#150c19"/>
    <rect x="104" y="47" width="150" height="3" fill="#150c19"/>
    <text x="124" y="35" class="mono" font-size="14" fill="#ffd1e3">◆ vi.config.ts</text>
    <text x="280" y="35" class="mono" font-size="14" fill="#6b5a70">README.md</text>
    <text x="1170" y="35" class="mono" font-size="12" fill="#6b5a70" text-anchor="end">01 — ABOUT</text>

    <!-- code -->
    <g class="mono" font-size="17" xml:space="preserve">
      <g fill="#4d3d52" text-anchor="end">
        <text x="56" y="100">1</text><text x="56" y="130">2</text><text x="56" y="160">3</text>
        <text x="56" y="190">4</text><text x="56" y="220">5</text><text x="56" y="250">6</text>
        <text x="56" y="280">7</text><text x="56" y="310">8</text><text x="56" y="340">9</text>
        <text x="56" y="370">10</text><text x="56" y="400">11</text><text x="56" y="430">12</text>
      </g>
      <text x="84" y="100" class="ln" style="animation-delay:.1s"><tspan class="cm">//&#160;hi!&#160;this&#160;is&#160;me,&#160;compiled.</tspan></text>
      <text x="84" y="130" class="ln" style="animation-delay:.25s"><tspan class="kw">const</tspan><tspan class="id">&#160;vi&#160;</tspan><tspan class="pu">=&#160;{</tspan></text>
      <text x="84" y="160" class="ln" style="animation-delay:.4s"><tspan class="pr">&#160;&#160;roles</tspan><tspan class="pu">:&#160;[</tspan><tspan class="st">"Full-Stack&#160;Dev"</tspan><tspan class="pu">,&#160;</tspan><tspan class="st">"Project&#160;Manager"</tspan><tspan class="pu">],</tspan></text>
      <text x="84" y="190" class="ln" style="animation-delay:.55s"><tspan class="pr">&#160;&#160;buildsFor</tspan><tspan class="pu">:&#160;[</tspan><tspan class="st">"enterprise"</tspan><tspan class="pu">,&#160;</tspan><tspan class="st">"government"</tspan><tspan class="pu">],</tspan></text>
      <text x="84" y="220" class="ln" style="animation-delay:.7s"><tspan class="pr">&#160;&#160;frontend</tspan><tspan class="pu">:&#160;[</tspan><tspan class="st">"React"</tspan><tspan class="pu">,&#160;</tspan><tspan class="st">"Next.js"</tspan><tspan class="pu">,&#160;</tspan><tspan class="st">"TypeScript"</tspan><tspan class="pu">],</tspan></text>
      <text x="84" y="250" class="ln" style="animation-delay:.85s"><tspan class="pr">&#160;&#160;backend</tspan><tspan class="pu">:&#160;[</tspan><tspan class="st">"Node.js"</tspan><tspan class="pu">,&#160;</tspan><tspan class="st">"Express"</tspan><tspan class="pu">,&#160;</tspan><tspan class="st">"SQL"</tspan><tspan class="pu">],</tspan></text>
      <text x="84" y="280" class="ln" style="animation-delay:1s"><tspan class="pr">&#160;&#160;testing</tspan><tspan class="pu">:&#160;[</tspan><tspan class="st">"Playwright"</tspan><tspan class="pu">,&#160;</tspan><tspan class="st">"CodeceptJS"</tspan><tspan class="pu">,&#160;</tspan><tspan class="st">"Jest"</tspan><tspan class="pu">],</tspan></text>
      <text x="84" y="310" class="ln" style="animation-delay:1.15s"><tspan class="pr">&#160;&#160;speaks</tspan><tspan class="pu">:&#160;[</tspan><tspan class="st">"Tiếng&#160;Việt"</tspan><tspan class="pu">,&#160;</tspan><tspan class="st">"English"</tspan><tspan class="pu">],</tspan></text>
      <text x="84" y="340" class="ln" style="animation-delay:1.3s"><tspan class="pr">&#160;&#160;fuel</tspan><tspan class="pu">:&#160;</tspan><tspan class="st">"matcha&#160;+&#160;a&#160;good&#160;playlist"</tspan><tspan class="pu">,</tspan></text>
      <text x="84" y="370" class="ln" style="animation-delay:1.45s"><tspan class="pu">};</tspan></text>
      <text x="84" y="430" class="ln" style="animation-delay:1.6s"><tspan class="kw">export&#160;default</tspan><tspan class="id">&#160;vi</tspan><tspan class="pu">;</tspan><tspan class="cm">&#160;//&#160;✦&#160;ships&#160;things,&#160;keeps&#160;teams&#160;in&#160;sync</tspan></text>
    </g>
    <rect x="676" y="415" width="10" height="20" fill="#ff8fb8" class="cursor"/>

    <!-- side panel -->
    <line x1="790" y1="78" x2="790" y2="442" stroke="#ffffff" stroke-opacity=".07"/>
    <g transform="translate(826 0)">
      <text x="0" y="98" class="mono" font-size="12" letter-spacing="2.5" fill="#7d6a83">STATUS</text>
      <circle cx="7" cy="128" r="5" fill="#9cc26b" class="pulse"/>
      <circle cx="7" cy="128" r="5" fill="#9cc26b"/>
      <text x="24" y="135" class="sans" font-size="21" font-weight="600" fill="#f6eee3">Currently shipping</text>
      <text x="0" y="162" class="sans" font-size="15" fill="#a993a6">enterprise &amp; government web apps</text>

      <text x="0" y="214" class="mono" font-size="12" letter-spacing="2.5" fill="#7d6a83">MODE</text>
      <rect x="0" y="228" width="212" height="44" rx="22" fill="#1f1424" stroke="#ffffff" stroke-opacity=".08"/>
      <rect x="4" y="232" width="100" height="36" rx="18" fill="#ff8fb8" class="knob"/>
      <text x="54" y="256" class="mono lblDev" font-size="14" font-weight="700" text-anchor="middle" fill="#150c19">&lt;dev/&gt;</text>
      <text x="158" y="256" class="mono lblPm" font-size="14" font-weight="700" text-anchor="middle" fill="#c9b6c4">pm.plan()</text>
      <text x="228" y="256" class="sans" font-size="14" fill="#7d6a83">both, daily</text>

      <text x="0" y="322" class="mono" font-size="12" letter-spacing="2.5" fill="#7d6a83">WORKS WITH</text>
      <text x="0" y="352" class="sans" font-size="17" fill="#f6eee3">Engineers · BAs · Designers · Clients</text>

      <text x="0" y="398" class="mono" font-size="12" letter-spacing="2.5" fill="#7d6a83">SUPERPOWER</text>
      <text x="0" y="428" class="serif" font-style="italic" font-size="19" fill="#ff9ec4">reads the codebase <tspan fill="#b9d98f">and</tspan> the roadmap</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="469" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
