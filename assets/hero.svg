<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Le Thi Yen Vi — Full-Stack Developer and Project Manager">
  <defs>
    <radialGradient id="glowPink" cx="0.85" cy="0.05" r="0.65">
      <stop offset="0" stop-color="#ff4f9a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff4f9a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMatcha" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#9cc26b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9cc26b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe3ee"/>
      <stop offset="0.5" stop-color="#ff9ec4"/>
      <stop offset="1" stop-color="#ff4f9a"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf4ea"/>
      <stop offset="0.7" stop-color="#eadfcf"/>
      <stop offset="1" stop-color="#cfc0ab"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="440" rx="28"/></clipPath>
    <path id="petal" d="M0,-9 C7,-9 11,-2 9,5 C7,10 2,9 0,6 C-2,9 -7,10 -9,5 C-11,-2 -7,-9 0,-9Z"/>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }

    .fall { animation: fall linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes fall {
      0%   { transform: translate(0, -40px) rotate(0deg); opacity: 0; }
      10%  { opacity: 0.95; }
      85%  { opacity: 0.8; }
      100% { transform: translate(-170px, 500px) rotate(340deg); opacity: 0; }
    }

    .underline { stroke-dasharray: 620; stroke-dashoffset: 620; animation: draw 1.6s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .rise { opacity: 0; animation: rise .9s cubic-bezier(.22,1,.36,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .role { opacity: 0; animation: role 10.5s ease-in-out infinite; }
    @keyframes role {
      0%   { opacity: 0; transform: translateY(10px); }
      4%, 29% { opacity: 1; transform: translateY(0); }
      33%, 100% { opacity: 0; transform: translateY(-8px); }
    }

    .pulse { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.8); } }

    .steam { opacity: 0; animation: steam 3.6s ease-in-out infinite; }
    @keyframes steam {
      0%   { opacity: 0; transform: translateY(12px); }
      35%  { opacity: .55; }
      100% { opacity: 0; transform: translateY(-26px); }
    }
    .float { animation: float 6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="#150c19"/>
    <rect width="1200" height="440" fill="url(#dots)"/>
    <rect width="1200" height="440" fill="url(#glowPink)"/>
    <rect width="1200" height="440" fill="url(#glowMatcha)"/>

    <!-- ghost monogram -->
    <text x="735" y="430" class="serif" font-style="italic" font-size="400" fill="none" stroke="#ff8fb8" stroke-opacity="0.07" stroke-width="2">vi</text>

    <!-- falling sakura petals -->
    <g transform="translate(640 0)"><g class="fall" style="animation-duration:11s;animation-delay:-2s"><use href="#petal" fill="#ffb3cf" opacity=".9"/></g></g>
    <g transform="translate(720 0) scale(.7)"><g class="fall" style="animation-duration:13s;animation-delay:-8s"><use href="#petal" fill="#ff8fb8"/></g></g>
    <g transform="translate(810 0) scale(1.2)"><g class="fall" style="animation-duration:10s;animation-delay:-5s"><use href="#petal" fill="#ffc9dc" opacity=".85"/></g></g>
    <g transform="translate(880 0) scale(.8)"><g class="fall" style="animation-duration:14s;animation-delay:-11s"><use href="#petal" fill="#ff8fb8" opacity=".8"/></g></g>
    <g transform="translate(990 0)"><g class="fall" style="animation-duration:12s;animation-delay:-1s"><use href="#petal" fill="#ffb3cf"/></g></g>
    <g transform="translate(1060 0) scale(.6)"><g class="fall" style="animation-duration:9s;animation-delay:-6s"><use href="#petal" fill="#ff4f9a" opacity=".7"/></g></g>
    <g transform="translate(1130 0) scale(1.1)"><g class="fall" style="animation-duration:12.5s;animation-delay:-9s"><use href="#petal" fill="#ffc9dc" opacity=".9"/></g></g>
    <g transform="translate(1190 0) scale(.75)"><g class="fall" style="animation-duration:10.5s;animation-delay:-3.5s"><use href="#petal" fill="#ff8fb8"/></g></g>
    <g transform="translate(1240 0) scale(.9)"><g class="fall" style="animation-duration:15s;animation-delay:-12s"><use href="#petal" fill="#ffb3cf" opacity=".8"/></g></g>
    <g transform="translate(560 0) scale(.55)"><g class="fall" style="animation-duration:16s;animation-delay:-4s"><use href="#petal" fill="#ff8fb8" opacity=".6"/></g></g>

    <!-- top meta row -->
    <g class="rise" style="animation-delay:.05s">
      <text x="72" y="78" class="mono" font-size="14" letter-spacing="3" fill="#ff8fb8">~/LETHIYENVI</text>
      <circle cx="232" cy="73" r="4.5" fill="#9cc26b" class="pulse"/>
      <circle cx="232" cy="73" r="4.5" fill="#9cc26b"/>
      <text x="246" y="78" class="mono" font-size="14" letter-spacing="1" fill="#b9d98f">currently shipping</text>
    </g>

    <!-- greeting + name -->
    <text x="74" y="152" class="sans rise" font-size="22" fill="#c9b6c4" style="animation-delay:.15s">Xin chào — I'm</text>
    <text x="68" y="240" class="serif rise" font-style="italic" font-size="92" fill="url(#nameFill)" style="animation-delay:.25s">Le Thi Yen Vi</text>
    <path class="underline" d="M74,266 C220,256 420,262 640,252" fill="none" stroke="#ff4f9a" stroke-width="3" stroke-linecap="round"/>

    <!-- rotating role line -->
    <g class="sans" font-size="25" fill="#f6eee3">
      <text x="74" y="322" class="role" style="animation-delay:0s"><tspan fill="#ff8fb8" font-weight="600">I write the code</tspan>  ·  React, Node.js &amp; TypeScript</text>
      <text x="74" y="322" class="role" style="animation-delay:3.5s"><tspan fill="#b9d98f" font-weight="600">I ship the roadmap</tspan>  ·  enterprise &amp; government apps</text>
      <text x="74" y="322" class="role" style="animation-delay:7s"><tspan fill="#ffd1a1" font-weight="600">I translate</tspan>  ·  between engineering, BA &amp; design</text>
    </g>

    <!-- chips -->
    <g class="mono rise" font-size="13" text-anchor="middle" style="animation-delay:.6s">
      <rect x="72" y="368" width="138" height="32" rx="16" fill="#ff8fb8" fill-opacity=".07" stroke="#ff8fb8" stroke-opacity=".4"/>
      <text x="141" y="389" fill="#ffd1e3">full-stack dev</text>
      <rect x="222" y="368" width="150" height="32" rx="16" fill="#9cc26b" fill-opacity=".07" stroke="#9cc26b" stroke-opacity=".45"/>
      <text x="297" y="389" fill="#d3e8b5">project manager</text>
      <rect x="384" y="368" width="136" height="32" rx="16" fill="#ff8fb8" fill-opacity=".07" stroke="#ff8fb8" stroke-opacity=".4"/>
      <text x="452" y="389" fill="#ffd1e3">qa automation</text>
      <rect x="532" y="368" width="92" height="32" rx="16" fill="#ffd1a1" fill-opacity=".07" stroke="#ffd1a1" stroke-opacity=".4"/>
      <text x="578" y="389" fill="#ffe4c8">vi ⇄ en</text>
    </g>

    <!-- matcha bowl -->
    <g class="float">
      <g fill="none" stroke="#f6eee3" stroke-width="3" stroke-linecap="round">
        <path class="steam" style="animation-delay:0s"   d="M925,222 C910,200 940,186 926,162 C914,142 936,128 928,110"/>
        <path class="steam" style="animation-delay:1.2s" d="M962,218 C948,194 978,180 963,154 C951,134 973,118 965,98"/>
        <path class="steam" style="animation-delay:2.4s" d="M999,222 C985,200 1013,186 1000,162 C989,142 1009,128 1002,112"/>
      </g>
      <ellipse cx="962" cy="352" rx="150" ry="20" fill="#000000" opacity=".35"/>
      <path d="M850,252 Q852,346 962,352 Q1072,346 1074,252 Z" fill="url(#bowl)"/>
      <path d="M864,292 Q962,312 1060,292" fill="none" stroke="#ff8fb8" stroke-width="2" stroke-opacity=".7"/>
      <g fill="#ff8fb8" opacity=".75">
        <circle cx="900" cy="306" r="3"/><circle cx="962" cy="314" r="3.5"/><circle cx="1024" cy="306" r="3"/>
      </g>
      <ellipse cx="962" cy="252" rx="112" ry="22" fill="#e6d9c6"/>
      <ellipse cx="962" cy="253" rx="101" ry="17" fill="#8db35a"/>
      <ellipse cx="955" cy="250" rx="70" ry="10" fill="#a6c977" opacity=".6"/>
      <path d="M962,262 C949,252 940,246 948,241 C953,238 958,241 962,246 C966,241 971,238 976,241 C984,246 975,252 962,262Z" fill="#eef5df" opacity=".92"/>
    </g>
    <text x="962" y="400" class="mono" font-size="13" text-anchor="middle" fill="#9cc26b" opacity=".85">fuel.level = "matcha" ✓</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
