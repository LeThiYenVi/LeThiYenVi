<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="How I work: Requirements, Design, Build, Test, Ship">
  <defs>
    <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>
    <radialGradient id="glow" cx="0.5" cy="1.1" r="0.7">
      <stop offset="0" stop-color="#9cc26b" stop-opacity=".14"/>
      <stop offset="1" stop-color="#9cc26b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-2" y="-2" width="5" height="5"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .flow { stroke-dasharray: 4 12; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .ring { animation: ring 6s ease-out infinite; }
    @keyframes ring {
      0%   { stroke: #ff8fb8; stroke-opacity: 1; fill: #3a1a2e; }
      14%  { stroke: #ff8fb8; stroke-opacity: .35; fill: #1f1424; }
      100% { stroke: #ff8fb8; stroke-opacity: .35; fill: #1f1424; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="#150c19"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <text x="60" y="62" class="mono" font-size="12" letter-spacing="2.5" fill="#7d6a83">02 — HOW I WORK</text>
    <text x="60" y="104" class="serif" font-style="italic" font-size="30" fill="#f6eee3">From a requirement doc to production — <tspan fill="#ff9ec4">I can walk every step.</tspan></text>

    <!-- PM bracket -->
    <path d="M140,178 L140,166 L1060,166 L1060,178" fill="none" stroke="#9cc26b" stroke-opacity=".55" stroke-width="1.5"/>
    <rect x="510" y="154" width="180" height="24" rx="12" fill="#150c19" stroke="#9cc26b" stroke-opacity=".55"/>
    <text x="600" y="171" class="mono" font-size="12" text-anchor="middle" fill="#b9d98f">project manager hat</text>

    <!-- track -->
    <line x1="140" y1="226" x2="1060" y2="226" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
    <line x1="140" y1="226" x2="1060" y2="226" stroke="#ff8fb8" stroke-opacity=".5" stroke-width="2" class="flow"/>

    <!-- nodes -->
    <g class="mono" font-size="14" text-anchor="middle">
      <circle cx="140"  cy="226" r="32" stroke-width="2" fill="#1f1424" stroke="#ff8fb8" stroke-opacity=".35" class="ring" style="animation-delay:0s"/>
      <circle cx="370"  cy="226" r="32" stroke-width="2" fill="#1f1424" stroke="#ff8fb8" stroke-opacity=".35" class="ring" style="animation-delay:1.5s"/>
      <circle cx="600"  cy="226" r="32" stroke-width="2" fill="#1f1424" stroke="#ff8fb8" stroke-opacity=".35" class="ring" style="animation-delay:3s"/>
      <circle cx="830"  cy="226" r="32" stroke-width="2" fill="#1f1424" stroke="#ff8fb8" stroke-opacity=".35" class="ring" style="animation-delay:4.5s"/>
      <circle cx="1060" cy="226" r="32" stroke-width="2" fill="#1f1424" stroke="#ff8fb8" stroke-opacity=".35" class="ring" style="animation-delay:5.9s"/>
      <g fill="#ffd1e3">
        <text x="140" y="231">01</text><text x="370" y="231">02</text><text x="600" y="231">03</text>
        <text x="830" y="231">04</text><text x="1060" y="231">05</text>
      </g>
    </g>

    <!-- traveling spark -->
    <circle r="12" fill="#ff4f9a" opacity=".7" filter="url(#blur)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M140,226 L1060,226"/>
    </circle>
    <circle r="5" fill="#ffe3ee">
      <animateMotion dur="6s" repeatCount="indefinite" path="M140,226 L1060,226"/>
    </circle>

    <!-- labels -->
    <g text-anchor="middle">
      <g class="sans" font-size="18" font-weight="600" fill="#f6eee3">
        <text x="140" y="290">Requirements</text><text x="370" y="290">Design</text><text x="600" y="290">Build</text>
        <text x="830" y="290">Test</text><text x="1060" y="290">Ship</text>
      </g>
      <g class="mono" font-size="12.5" fill="#a993a6">
        <text x="140" y="312">BA · user stories</text><text x="370" y="312">Figma · UX review</text>
        <text x="600" y="312">React · Node · TS</text><text x="830" y="312">Playwright · Jest</text>
        <text x="1060" y="312">release · handover</text>
      </g>
    </g>

    <!-- dev bracket -->
    <path d="M560,330 L560,340 L870,340 L870,330" fill="none" stroke="#ff8fb8" stroke-opacity=".55" stroke-width="1.5"/>
    <text x="715" y="362" class="mono" font-size="12" text-anchor="middle" fill="#ff9ec4">developer hat</text>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
