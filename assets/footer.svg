<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-label="Cảm ơn đã ghé thăm — thanks for stopping by">
  <defs>
    <clipPath id="card"><rect width="1200" height="180" rx="24"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4f9a" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#ff4f9a" stop-opacity="0"/>
      <stop offset="1" stop-color="#9cc26b" stop-opacity=".16"/>
    </linearGradient>
    <path id="petal" d="M0,-9 C7,-9 11,-2 9,5 C7,10 2,9 0,6 C-2,9 -7,10 -9,5 C-11,-2 -7,-9 0,-9Z"/>
  </defs>
  <style>
    .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .drift { animation: drift linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes drift {
      0% { transform: translate(0,-20px) rotate(0); opacity: 0; }
      15% { opacity: .9; }
      100% { transform: translate(-90px, 220px) rotate(300deg); opacity: 0; }
    }
    .beat { animation: beat 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="180" fill="#150c19"/>
    <rect width="1200" height="180" fill="url(#fade)"/>
    <g transform="translate(120 0)"><g class="drift" style="animation-duration:8s;animation-delay:-1s"><use href="#petal" fill="#ffb3cf"/></g></g>
    <g transform="translate(260 0) scale(.7)"><g class="drift" style="animation-duration:10s;animation-delay:-6s"><use href="#petal" fill="#ff8fb8"/></g></g>
    <g transform="translate(980 0) scale(.9)"><g class="drift" style="animation-duration:9s;animation-delay:-3s"><use href="#petal" fill="#ffc9dc"/></g></g>
    <g transform="translate(1120 0) scale(.6)"><g class="drift" style="animation-duration:11s;animation-delay:-8s"><use href="#petal" fill="#ff8fb8"/></g></g>

    <text x="600" y="86" text-anchor="middle" class="serif" font-style="italic" font-size="34" fill="#f6eee3">Cảm ơn đã ghé thăm <tspan fill="#ff9ec4">— thanks for stopping by.</tspan></text>
    <g class="mono" font-size="13" fill="#7d6a83" text-anchor="middle">
      <text x="600" y="128">made with <tspan fill="#ff4f9a" class="beat">♥</tspan> &amp; a lot of matcha  ·  github.com/LeThiYenVi</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="179" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
</svg>
